# Two-server setup, web side: the web app and Caddy in front. API_URL is the API server's private address,
# e.g. http://172.31.22.132:4000. Settings from deploy/.env.
name: kyvag

services:
  frontend:
    build:
      context: ${FRONTEND_DIR:-../../crm-kyvag}
      args:
        API_URL: ${API_URL:?Set API_URL in deploy/.env}
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
